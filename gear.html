<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CRUSH GEAR IMAGE BATTLE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    overflow:hidden;
    color:white;

    background:
    radial-gradient(circle at center,
    #111827 0%,
    #020617 100%);
}

/* background arena effect */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    repeating-radial-gradient(
        circle at center,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 40px
    );

    opacity:0.15;

    animation:arenaMove 12s linear infinite;
}

@keyframes arenaMove{
    from{
        transform:rotate(0deg) scale(1);
    }
    to{
        transform:rotate(360deg) scale(1.2);
    }
}

.container{
    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    height:100vh;
    gap:20px;
    padding:20px;
}

h1{
    font-size:42px;
    color:#38bdf8;

    text-shadow:
    0 0 10px #38bdf8,
    0 0 20px #38bdf8;
}

.upload-section{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    width:260px;

    padding:20px;

    border-radius:20px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    text-align:center;
}

.card h2{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:10px;

    background:#111827;
    color:white;

    border:1px solid #334155;

    border-radius:10px;
}

.controls{
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

button{
    padding:14px 30px;

    border:none;
    border-radius:14px;

    background:
    linear-gradient(
    45deg,
    #1e293b,
    #334155
    );

    color:#38bdf8;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    border:1px solid #38bdf855;

    box-shadow:
    0 0 15px #38bdf833;

    transition:0.3s;
}

button:hover{
    transform:scale(1.05);

    box-shadow:
    0 0 25px #38bdf888;
}

.timer{
    font-size:42px;
    font-weight:bold;

    color:#facc15;

    text-shadow:
    0 0 10px #facc15,
    0 0 20px #facc15;
}

.arena{
    width:900px;
    max-width:95vw;

    height:420px;

    position:relative;

    overflow:hidden;

    border-radius:50px;

    background:
    radial-gradient(circle,
    #1e293b,
    #020617);

    border:4px solid #38bdf8;

    box-shadow:
    inset 0 0 40px rgba(0,0,0,0.8),
    0 0 40px rgba(56,189,248,0.3);
}

.vs{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    font-size:90px;
    font-weight:bold;

    color:rgba(255,255,255,0.08);
}

.gear{
    width:140px;
    height:140px;

    position:absolute;

    border-radius:50%;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#111827;

    animation:spin 0.8s linear infinite;

    transition:all 0.1s linear;
}

.gear img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}

#gearA{
    left:40px;
    top:130px;

    border:5px solid #22c55e;

    box-shadow:
    0 0 25px #22c55e;
}

#gearB{
    right:40px;
    top:130px;

    border:5px solid #ef4444;

    box-shadow:
    0 0 25px #ef4444;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.spark{
    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#facc15;

    box-shadow:
    0 0 20px #facc15;

    z-index:999;
}

.result{
    min-height:40px;

    font-size:34px;
    font-weight:bold;

    color:#4ade80;

    text-shadow:
    0 0 15px #4ade80;
}

</style>
</head>
<body>

<div class="container">

<h1>⚔️ CRUSH GEAR IMAGE BATTLE ⚔️</h1>

<div class="upload-section">

<div class="card">
<h2>Ring A</h2>
<input type="file" id="uploadA" accept="image/*">
<p id="sizeA">Ukuran: 0 KB</p>
</div>

<div class="card">
<h2>Ring B</h2>
<input type="file" id="uploadB" accept="image/*">
<p id="sizeB">Ukuran: 0 KB</p>
</div>

</div>

<div class="controls">
<button onclick="startBattle()">🔥 MULAI BATTLE</button>
<div class="timer" id="timer">40</div>
</div>

<div class="arena" id="arena">

<div class="vs">VS</div>

<div class="gear" id="gearA">
<img id="imgA">
</div>

<div class="gear" id="gearB">
<img id="imgB">
</div>

</div>

<div class="result" id="result"></div>

</div>

<script>

let fileSizeA=0;
let fileSizeB=0;

const uploadA=document.getElementById("uploadA");
const uploadB=document.getElementById("uploadB");

uploadA.addEventListener("change",(e)=>{

    const file=e.target.files[0];

    if(file){

        fileSizeA=file.size;

        document.getElementById("sizeA").innerText=
        `Ukuran: ${(file.size/1024).toFixed(2)} KB`;

        const reader=new FileReader();

        reader.onload=function(evt){
            document.getElementById("imgA").src=
            evt.target.result;
        }

        reader.readAsDataURL(file);

    }

});

uploadB.addEventListener("change",(e)=>{

    const file=e.target.files[0];

    if(file){

        fileSizeB=file.size;

        document.getElementById("sizeB").innerText=
        `Ukuran: ${(file.size/1024).toFixed(2)} KB`;

        const reader=new FileReader();

        reader.onload=function(evt){
            document.getElementById("imgB").src=
            evt.target.result;
        }

        reader.readAsDataURL(file);

    }

});

let timerInterval;
let moveInterval;

function createSpark(x,y){

    const arena=document.getElementById("arena");

    for(let i=0;i<20;i++){

        const spark=document.createElement("div");

        spark.className="spark";

        spark.style.left=x+"px";
        spark.style.top=y+"px";

        arena.appendChild(spark);

        const angle=Math.random()*Math.PI*2;
        const distance=Math.random()*90;

        const moveX=Math.cos(angle)*distance;
        const moveY=Math.sin(angle)*distance;

        spark.animate([

            {
                transform:"translate(0,0) scale(1)",
                opacity:1
            },

            {
                transform:`translate(${moveX}px,${moveY}px) scale(0)`,
                opacity:0
            }

        ],{

            duration:600,
            easing:"ease-out"

        });

        setTimeout(()=>{
            spark.remove();
        },600);

    }

}

function splitLoseAnimation(gear){

    const leftPart=gear.cloneNode(true);
    const rightPart=gear.cloneNode(true);

    leftPart.style.position="absolute";
    rightPart.style.position="absolute";

    leftPart.style.left=gear.style.left;
    leftPart.style.top=gear.style.top;

    rightPart.style.left=gear.style.left;
    rightPart.style.top=gear.style.top;

    leftPart.style.clipPath=
    "polygon(0 0, 50% 0, 50% 100%, 0 100%)";

    rightPart.style.clipPath=
    "polygon(50% 0, 100% 0, 100% 100%, 50% 100%)";

    leftPart.style.zIndex="999";
    rightPart.style.zIndex="999";

    gear.parentElement.appendChild(leftPart);
    gear.parentElement.appendChild(rightPart);

    gear.style.display="none";

    leftPart.animate([

        {
            transform:"translate(0,0) rotate(0deg)",
            opacity:1
        },

        {
            transform:"translate(-200px,120px) rotate(-250deg)",
            opacity:0
        }

    ],{

        duration:1600,
        easing:"ease-out",
        fill:"forwards"

    });

    rightPart.animate([

        {
            transform:"translate(0,0) rotate(0deg)",
            opacity:1
        },

        {
            transform:"translate(200px,-120px) rotate(250deg)",
            opacity:0
        }

    ],{

        duration:1600,
        easing:"ease-out",
        fill:"forwards"

    });

    createSpark(
        parseInt(gear.style.left)+70,
        parseInt(gear.style.top)+70
    );

}

function startBattle(){

    if(!fileSizeA || !fileSizeB){

        alert("Upload kedua gambar terlebih dahulu!");

        return;

    }

    const gearA=document.getElementById("gearA");
    const gearB=document.getElementById("gearB");

    const arena=document.getElementById("arena");

    const result=document.getElementById("result");

    const timer=document.getElementById("timer");

    result.innerText="";

    gearA.style.display="flex";
    gearB.style.display="flex";

    let timeLeft=40;

    timer.innerText=timeLeft;

    clearInterval(timerInterval);
    clearInterval(moveInterval);

    let posAX=40;
    let posAY=130;

    let posBX=arena.clientWidth-180;
    let posBY=130;

    let velAX=5;
    let velAY=4;

    let velBX=-5;
    let velBY=-4;

    moveInterval=setInterval(()=>{

        posAX+=velAX;
        posAY+=velAY;

        posBX+=velBX;
        posBY+=velBY;

        if(posAX<=0 || posAX>=arena.clientWidth-140){
            velAX*=-1;
        }

        if(posAY<=0 || posAY>=arena.clientHeight-140){
            velAY*=-1;
        }

        if(posBX<=0 || posBX>=arena.clientWidth-140){
            velBX*=-1;
        }

        if(posBY<=0 || posBY>=arena.clientHeight-140){
            velBY*=-1;
        }

        const dx=posAX-posBX;
        const dy=posAY-posBY;

        const distance=Math.sqrt(dx*dx+dy*dy);

        if(distance<140){

            velAX*=-1;
            velAY*=-1;

            velBX*=-1;
            velBY*=-1;

            velAX+=(Math.random()-0.5)*8;
            velAY+=(Math.random()-0.5)*8;

            velBX+=(Math.random()-0.5)*8;
            velBY+=(Math.random()-0.5)*8;

            createSpark(
                (posAX+posBX)/2,
                (posAY+posBY)/2
            );

        }

        gearA.style.left=posAX+"px";
        gearA.style.top=posAY+"px";

        gearB.style.left=posBX+"px";
        gearB.style.top=posBY+"px";

    },30);

    timerInterval=setInterval(()=>{

        timeLeft--;

        timer.innerText=timeLeft;

        if(timeLeft<=0){

            clearInterval(timerInterval);
            clearInterval(moveInterval);

            if(fileSizeA>fileSizeB){

                result.innerText="🏆 RING A MENANG!";

                splitLoseAnimation(gearB);

            }

            else if(fileSizeB>fileSizeA){

                result.innerText="🏆 RING B MENANG!";

                splitLoseAnimation(gearA);

            }

            else{

                result.innerText="⚡ HASIL SERI!";

            }

        }

    },1000);

}

</script>

</body>
</html>
