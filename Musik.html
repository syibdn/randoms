<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rotating Circle Spectrum</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050816;
    overflow:hidden;
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    position:relative;
    width:100%;
    height:100%;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

.controls{
    position:absolute;
    z-index:10;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:15px 25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.controls h1{
    margin-bottom:15px;
    font-size:24px;
}

input{
    margin:6px 0;
    color:white;
}

audio{
    width:300px;
    margin-top:10px;
}

.info{
    margin-top:10px;
    font-size:12px;
    opacity:0.7;
}
</style>
</head>
<body>

<div class="container">

    <div class="controls">
        <h1>🎵 Rotating Music Spectrum</h1>

        Upload Audio:
        <br>
        <input type="file" id="audioFile" accept="audio/*">

        <br><br>

        Upload Gambar:
        <br>
        <input type="file" id="imageFile" accept="image/*">

        <br>

        <audio id="audio" controls></audio>

        <div class="info">
            Gambar akan berputar mengikuti musik
        </div>
    </div>

    <canvas id="canvas"></canvas>

</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize',()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

const audio = document.getElementById('audio');
const audioFile = document.getElementById('audioFile');
const imageFile = document.getElementById('imageFile');

let audioContext;
let analyser;
let dataArray;

let centerImage = new Image();
let imageLoaded = false;

let rotation = 0;

// ================= IMAGE =================

imageFile.addEventListener('change', function(){

    const file = this.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        centerImage.src = e.target.result;
        imageLoaded = true;

    }

    reader.readAsDataURL(file);

});

// ================= AUDIO =================

audioFile.addEventListener('change', function(){

    const file = this.files[0];
    if(!file) return;

    const url = URL.createObjectURL(file);

    audio.src = url;

    if(audioContext){
        audioContext.close();
    }

    audioContext = new(window.AudioContext || window.webkitAudioContext)();

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 512;

    const bufferLength = analyser.frequencyBinCount;

    dataArray = new Uint8Array(bufferLength);

    const source = audioContext.createMediaElementSource(audio);

    source.connect(analyser);
    analyser.connect(audioContext.destination);

    audio.play();

    animate();

});

// ================= ANIMATION =================

function animate(){

    requestAnimationFrame(animate);

    if(!analyser) return;

    analyser.getByteFrequencyData(dataArray);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    const radius = 140;

    // ================= ENERGY MUSIC =================

    let total = 0;

    for(let i=0;i<80;i++){
        total += dataArray[i];
    }

    const energy = total / 80;

    // speed rotation mengikuti musik
    rotation += 0.002 + (energy / 50000);

    // pulse lingkaran
    const pulse = 120 + (energy / 12);

    // ================= GLOW =================

    const gradient = ctx.createRadialGradient(
        cx,cy,50,
        cx,cy,350
    );

    gradient.addColorStop(0,"rgba(0,255,255,0.15)");
    gradient.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = gradient;

    ctx.beginPath();
    ctx.arc(cx,cy,350,0,Math.PI*2);
    ctx.fill();

    // ================= SPECTRUM =================

    const bars = 180;

    for(let i=0;i<bars;i++){

        const value = dataArray[i];

        const angle = (i / bars) * Math.PI * 2;

        const barHeight = value * 0.8;

        const x1 = cx + Math.cos(angle) * radius;
        const y1 = cy + Math.sin(angle) * radius;

        const x2 = cx + Math.cos(angle) * (radius + barHeight);
        const y2 = cy + Math.sin(angle) * (radius + barHeight);

        const hue = i * 2;

        ctx.strokeStyle = `hsl(${hue},100%,60%)`;

        ctx.lineWidth = 4;

        ctx.shadowBlur = 15;
        ctx.shadowColor = `hsl(${hue},100%,60%)`;

        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();

    }

    // ================= IMAGE ROTATION =================

    ctx.save();

    ctx.translate(cx,cy);

    ctx.rotate(rotation);

    ctx.beginPath();
    ctx.arc(0,0,pulse,0,Math.PI*2);
    ctx.closePath();
    ctx.clip();

    if(imageLoaded){

        ctx.drawImage(
            centerImage,
            -pulse,
            -pulse,
            pulse * 2,
            pulse * 2
        );

    }else{

        ctx.fillStyle = "#111827";

        ctx.beginPath();
        ctx.arc(0,0,pulse,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.textAlign = "center";

        ctx.fillText("UPLOAD",0,-10);
        ctx.fillText("IMAGE",0,20);

    }

    ctx.restore();

    // ================= BORDER =================

    ctx.beginPath();
    ctx.arc(cx,cy,pulse,0,Math.PI*2);

    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 5;

    ctx.shadowBlur = 20;
    ctx.shadowColor = "cyan";

    ctx.stroke();

}

</script>

</body>
</html>
